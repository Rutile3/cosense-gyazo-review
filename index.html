<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="CosenseエクスポートからGyazo画像を抽出し、配信再開作業の進捗を管理するローカルツール">
    <title>Cosense Gyazo 配信再開チェッカー</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <!-- 通常のページ閲覧のみを計測します。読み込んだデータは送信しません。 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-501GNTE7BK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-501GNTE7BK');
    </script>
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="navbar navbar-dark bg-brand shadow-sm">
        <div class="container-md d-flex align-items-center">
            <a href="./" class="navbar-brand fw-bold">ツール名</a>
            <a href="https://link-hub.rutile3.com/" target="_blank" rel="noopener"
                class="d-flex align-items-center text-decoration-none ms-auto">
                <span class="text-white small ms-auto">by Rutile3</span>
                <img src="avatar.png" alt="Avatar" class="avatar ms-2">
            </a>
        </div>
    </header>
    <main class="flex-fill container-xl my-4">
        <section class="card shadow-sm mb-4" aria-labelledby="input-heading">
            <div class="card-body p-4"><div class="row align-items-center g-4">
                <div class="col-lg-7"><h1 id="input-heading" class="h3 mb-2">エクスポートJSONを読み込む</h1><p class="text-secondary mb-0">ファイルはこのブラウザ内だけで解析します。JSON本文やページ内容を外部へ送信・保存しません。</p></div>
                <div class="col-lg-5"><label id="drop-zone" class="drop-zone" for="file-input" tabindex="0"><span class="drop-zone-title">ここにJSONをドロップ</span><span class="small text-secondary">またはクリックしてファイルを選択</span><input id="file-input" type="file" accept=".json,application/json" hidden></label></div>
            </div><div id="message" class="alert mt-3 mb-0 d-none" role="alert" aria-live="polite"></div></div>
        </section>
        <section id="workspace" class="d-none" aria-labelledby="project-heading">
            <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-3">
                <div><p class="text-secondary small mb-1">読み込み中のプロジェクト</p><h2 id="project-heading" class="h3 mb-0"></h2></div>
                <div class="d-flex flex-wrap gap-2"><button id="open-next" type="button" class="btn btn-brand">次の未確認を開く</button><button id="export-csv" type="button" class="btn btn-outline-secondary">作業状況をCSV出力</button></div>
            </div>
            <div class="notice mb-4" role="note"><strong>「完了」は自己申告の記録です。</strong> このツールはGyazoの配信状態を確認・変更しません。画像をGyazoで確認し、公開して問題ないものだけ、Gyazo上で手動で「配信を再開する」を押してください。</div>
            <div class="summary-grid mb-4" aria-label="作業件数">
                <div class="summary-card"><span>対象画像</span><strong id="count-total">0</strong></div><div class="summary-card status-unchecked"><span>未確認</span><strong id="count-unchecked">0</strong></div><div class="summary-card status-completed"><span>完了</span><strong id="count-completed">0</strong></div><div class="summary-card status-pending"><span>保留</span><strong id="count-pending">0</strong></div><div class="summary-card status-excluded"><span>対象外</span><strong id="count-excluded">0</strong></div>
            </div>
            <div class="card shadow-sm">
                <div class="card-body border-bottom"><div class="row g-3 align-items-end">
                    <div class="col-md-5"><label for="search" class="form-label">検索</label><input id="search" type="search" class="form-control" placeholder="画像ID・ページ名・該当行を検索"></div>
                    <div class="col-md-3"><label for="status-filter" class="form-label">状況</label><select id="status-filter" class="form-select"><option value="all">すべて</option><option value="unchecked">未確認</option><option value="completed">完了</option><option value="pending">保留</option><option value="excluded">対象外</option></select></div>
                    <div class="col-md-2"><label for="page-size" class="form-label">表示件数</label><select id="page-size" class="form-select"><option value="10">10件</option><option value="20" selected>20件</option><option value="50">50件</option><option value="100">100件</option><option value="all">全件</option></select></div>
                    <div class="col-md-2 text-md-end"><span id="visible-count" class="small text-secondary"></span></div>
                </div></div>
                <div id="image-list" class="image-list" aria-live="polite"></div><div id="empty-filter" class="empty-state d-none">条件に一致する画像はありません。</div>
                <nav id="pagination" class="pagination-bar" aria-label="結果一覧のページ送り">
                    <button id="first-page" type="button" class="btn btn-outline-secondary">先頭へ</button>
                    <button id="previous-page" type="button" class="btn btn-outline-secondary">前へ</button>
                    <span id="page-info" class="small text-secondary" aria-live="polite"></span>
                    <button id="next-page" type="button" class="btn btn-outline-secondary">次へ</button>
                    <button id="last-page" type="button" class="btn btn-outline-secondary">末尾へ</button>
                </nav>
            </div>
        </section>
    </main>
    <footer class="py-3 bg-brand text-white">
        <div class="container-md small d-flex flex-column flex-sm-row justify-content-sm-between gap-1">
            <span>© 2025 Rutile3</span>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdZi21BbOmTiuOlzpjJSE-ptDKiHBHucX5AawyzjP9647AKfg/viewform?usp=dialog"
                target="_blank" rel="noopener" class="text-white">フィードバック</a>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
